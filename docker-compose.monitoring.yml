# ============================================================================
# AACP — Monitoring stack (postgres + redis + api + prometheus + grafana)
# Usage: docker compose -f docker-compose.monitoring.yml --env-file .env up -d
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: aacp-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-aacp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-aacp}
    ports:
      - "${DB_PORT_HOST:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aacp} -d ${DB_NAME:-aacp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aacp_network

  redis:
    image: redis:7-alpine
    container_name: aacp-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aacp_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aacp-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_URL: postgresql://${DB_USER:-aacp}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-aacp}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      WEBHOOK_DISPATCHER_ENABLED: "true"
    ports:
      - "3009:3009"
      - "9090:9090"  # Prometheus metrics
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3009/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aacp_network

  prometheus:
    image: prom/prometheus:latest
    container_name: aacp-prometheus
    depends_on:
      - api
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aacp_network

  grafana:
    image: grafana/grafana:latest
    container_name: aacp-grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aacp_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  aacp_network:
    name: aacp_network
