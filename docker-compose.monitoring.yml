version: "3.9"

services:
  # PostgreSQL — main database
  postgres:
    image: postgres:16-alpine
    container_name: aacp_postgres
    environment:
      POSTGRES_USER: aacp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aacp_dev_password}
      POSTGRES_DB: aacp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aacp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — cache, rate limiting, sessions
  redis:
    image: redis:7-alpine
    container_name: aacp_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AACP API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aacp_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_URL: postgresql://aacp:${DB_PASSWORD:-aacp_dev_password}@postgres:5432/aacp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      WEBHOOK_DISPATCHER_ENABLED: "true"
    ports:
      - "3009:3009"
      - "9090:9090"  # Prometheus metrics endpoint (mapped from internal)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3009/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ./apps/api/dist:/app/dist:ro

  # Prometheus — time-series metrics database
  prometheus:
    image: prom/prometheus:latest
    container_name: aacp_prometheus
    depends_on:
      - api
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Grafana — visualization and dashboarding
  grafana:
    image: grafana/grafana:latest
    container_name: aacp_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: aacp_network
