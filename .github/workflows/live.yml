name: Nightly Verification

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      E2E_SEED_ENABLED: "true"
      AACP_REPOSITORY: memory
      RUN_REAL_AI_E2E: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ASAAS_SANDBOX_KEY: ${{ secrets.ASAAS_SANDBOX_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API and current widget
        run: |
          pnpm --filter @zyon/api prisma:generate
          pnpm --filter @zyon/api build
          pnpm --filter @zyon/widget-v2 build

      - name: Install Playwright browsers
        run: pnpm --filter @zyon/widget-v2 exec playwright install --with-deps chromium

      - name: Run widget v2 browser smoke
        run: pnpm --filter @zyon/widget-v2 e2e

      - name: Run live API e2e (API suite)
        run: pnpm --filter @zyon/api test
        env:
          RUN_REAL_AI_E2E: "true"

      - name: Upload nightly report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-playwright-report
          path: apps/widget_v2/playwright-report/
          retention-days: 30
