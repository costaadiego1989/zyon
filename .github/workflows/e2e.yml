name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── Widget v2 mocked e2e (no real API needed) ───────────────────────────────
  widget-v2-e2e-mocked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @zyon/widget-v2 exec playwright install --with-deps chromium

      - name: Run widget v2 mocked e2e
        run: pnpm --filter @zyon/widget-v2 e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mocked
          path: apps/widget_v2/playwright-report/
          retention-days: 14

      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-mocked
          path: apps/widget_v2/test-results/
          retention-days: 14

  # ── API integration suite ───────────────────────────────────────────────────
  api-integration-suite:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      E2E_SEED_ENABLED: "true"
      AACP_REPOSITORY: memory
      # No OpenAI/Asaas keys — deterministic fallbacks must cover this suite.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and build API
        run: |
          pnpm --filter @zyon/api prisma:generate
          pnpm --filter @zyon/api build

      - name: Run API integration suite
        run: pnpm --filter @zyon/api test
