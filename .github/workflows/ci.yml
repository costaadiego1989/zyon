name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://zyon:zyon@localhost:5432/zyon?schema=public
  # Disable real AI / external calls in CI
  RUN_REAL_AI_E2E: "false"

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zyon
          POSTGRES_PASSWORD: zyon
          POSTGRES_DB: zyon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ severity)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint (architecture boundaries gate)
        working-directory: apps/api
        run: pnpm lint

      - name: Typecheck (api)
        working-directory: apps/api
        run: pnpm typecheck

      - name: Typecheck (widget)
        working-directory: apps/widget
        run: pnpm typecheck

      - name: Typecheck (dashboard)
        working-directory: apps/dashboard
        run: pnpm typecheck

      - name: Build packages
        run: pnpm -r build

      - name: Prisma generate
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Apply Prisma migrations
        working-directory: apps/api
        run: pnpm prisma:deploy

      - name: Unit tests (api)
        working-directory: apps/api
        run: pnpm test

      - name: Unit tests (widget)
        working-directory: apps/widget
        run: pnpm test

      - name: Unit tests (dashboard)
        working-directory: apps/dashboard
        run: pnpm test

      - name: Prisma integration tests
        working-directory: apps/api
        run: pnpm test:prisma

      - name: Widget coverage
        working-directory: apps/widget
        run: pnpm test:coverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            apps/widget/coverage/
          retention-days: 14

      - name: Build (api)
        working-directory: apps/api
        run: pnpm build

      - name: Build (widget)
        working-directory: apps/widget
        run: pnpm build

      - name: Build (dashboard)
        working-directory: apps/dashboard
        run: pnpm build
