name: Deploy to Railway

on:
  push:
    branches:
      - main
    tags:
      - v*

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel in-flight deploys

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  NODE_VERSION: '20'

jobs:
  # ── Gate: CI must pass before deploy ───────────────────────────────────────
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # Typecheck all apps
      - run: cd apps/api && pnpm typecheck
      - run: cd apps/dashboard && pnpm typecheck
      - run: cd apps/storefront && pnpm typecheck
      - run: cd apps/widget && pnpm typecheck

      # Lint
      - run: cd apps/api && pnpm lint

      # Test API
      - name: Setup test services
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 16
      - run: redis-server --daemonize yes
      - name: Run API tests
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/test_db"
          export REDIS_URL="redis://localhost:6379"
          cd apps/api && pnpm test

      # Test packages
      - run: cd packages/rules-engine && pnpm test
      - run: cd packages/shipping-engine && pnpm test
      - run: cd packages/conversation-engine && pnpm test
      - run: cd packages/negotiation-engine && pnpm test

      # Build all
      - run: cd apps/api && pnpm build
      - run: cd apps/dashboard && pnpm build
      - run: cd apps/storefront && pnpm build
      - run: cd apps/widget && pnpm build

  # ── Deploy: Production ─────────────────────────────────────────────────────
  # Triggered by push to `main` or a version tag (v*).
  # PostgreSQL + Redis are provisioned once in Railway (persistent plugins) —
  # they are NOT redeployed here (redeploying a DB every push is wasteful and
  # risky). Only the app services are pushed.
  deploy-production:
    needs: [ci-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API
        run: |
          railway up \
            --service api \
            --environment production \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Dashboard
        run: |
          railway up \
            --service dashboard \
            --environment production \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Storefront
        run: |
          railway up \
            --service storefront \
            --environment production \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment summary
        run: |
          echo "✅ Production deployment initiated for ${{ github.ref }}"
          echo "Services: api, dashboard, storefront"
          echo "Databases: postgres + redis (persistent, not redeployed)"
          echo "Monitor: https://railway.app"
