name: Seed reserved showroom catalog

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to seed
        required: true
        type: choice
        options:
          - homolog
          - production
      merchant_slug:
        description: Existing storefront slug that owns the reserved catalog
        required: true
        default: athom-technologies
        type: string

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      AACP_DEMO_MERCHANT_SLUG: ${{ inputs.merchant_slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @railway/cli
      - name: Upsert reserved products and cross-sell promotions
        run: railway run --service api --environment ${{ inputs.environment }} -- pnpm --filter @zyon/api seed:advanced-layout
