name: Fiscal dashboard checks

on:
  pull_request:
    paths:
      - 'apps/dashboard/**'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/fiscal-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiscal-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fiscal-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zyon/shared-types build
      - run: pnpm --filter @zyon/dashboard typecheck
      - name: Fiscal settings, navigation, permissions and subscription guards
        run: >-
          pnpm --filter @zyon/dashboard exec vitest run --maxWorkers=1 --minWorkers=1
          src/api/fiscal.spec.ts src/shell/fiscal-navigation.spec.ts
          src/pages/fiscal/FiscalSettingsPage.spec.tsx
          src/pages/fiscal/FiscalInvoicesPage.spec.tsx
          src/pages/fiscal/FiscalInvoiceDetail.spec.tsx
          src/shell/SubscriptionAccessGate.spec.tsx
          src/shell/subscription-route-policy.spec.ts
          src/shell/subscription-access-wiring.spec.ts
          src/shell/nav-config.spec.ts src/shell/DashboardShell.spec.tsx
          src/lib/auth/permissions.spec.ts
      - name: Build with the reviewed public authentication configuration
        run: pnpm --filter @zyon/dashboard build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ vars.VITE_MICROSOFT_CLIENT_ID }}
          VITE_FACEBOOK_CLIENT_ID: ${{ vars.VITE_FACEBOOK_CLIENT_ID }}
          VITE_OAUTH_REDIRECT_URI: ${{ vars.VITE_OAUTH_REDIRECT_URI }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_FACEBOOK_LOGIN_ENABLED: ${{ vars.VITE_FACEBOOK_LOGIN_ENABLED }}
      - name: Production fiscal scope and nullable connection regressions
        run: >-
          pnpm --filter @zyon/dashboard exec vitest run --maxWorkers=1 --minWorkers=1
          src/pages/fiscal/fiscal-production-ui.spec.tsx src/api/fiscal-connection-empty.spec.ts
      - name: Install the browser used by the existing acceptance script
        run: pnpm --filter @zyon/dashboard exec playwright install --with-deps msedge
      - name: Olist authorization and private notification journeys
        run: node apps/dashboard/tests/fiscal-olist-browser.mjs
      - name: Fiscal connection and invoice UI journeys
        run: node apps/dashboard/scripts/verify-fiscal-ui-review.mjs all
