services:
  postgres:
    image: postgres:16-alpine
    container_name: aacp-postgres
    environment:
      POSTGRES_USER: atendeai
      POSTGRES_PASSWORD: atendeai_dev
      POSTGRES_DB: aacp_dev
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atendeai -d aacp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aacp-postgres-data:/var/lib/postgresql/data
    networks:
      - aacp-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aacp-api
    environment:
      NODE_ENV: development
      PORT: "3009"
      # Use the docker-internal hostname for the postgres service.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aacp_test?schema=public
      CORS_ALLOWED_ORIGINS: "http://localhost:5175,http://localhost:8080,http://localhost:3009"
      E2E_SEED_ENABLED: "true"
      WEBHOOK_DISPATCHER_ENABLED: "false"
      # Public origin used by widget/email callbacks.
      PUBLIC_API_URL: http://localhost:3009
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
    # Run migrations, then start the compiled server.
    command: ["sh", "-c", "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js"]
    networks:
      - aacp-net

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: aacp-dashboard
    environment:
      VITE_API_BASE_URL: http://localhost:3009
    ports:
      - "5175:80"
    depends_on:
      - api
    networks:
      - aacp-net

networks:
  aacp-net:
    driver: bridge

volumes:
  aacp-postgres-data:
