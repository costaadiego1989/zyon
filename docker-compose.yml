services:
  postgres:
    image: postgres:16-alpine
    container_name: aacp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aacp_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aacp_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aacp-postgres-data:/var/lib/postgresql/data

volumes:
  aacp-postgres-data:
