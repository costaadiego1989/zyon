# ============================================================================
# AACP — Dev compose (api + dashboard + widget + postgres + redis)
# Usage:
#   docker compose --env-file .env up -d
#   docker compose --profile deploy up -d   # include api+dashboard+widget
# ============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aacp-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_HOST:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aacp-postgres-data:/var/lib/postgresql/data
    networks:
      - aacp-net

  redis:
    image: redis:7-alpine
    container_name: aacp-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aacp-redis-data:/data
    networks:
      - aacp-net

  api:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aacp-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3009}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      E2E_SEED_ENABLED: ${E2E_SEED_ENABLED:-false}
      WEBHOOK_DISPATCHER_ENABLED: ${WEBHOOK_DISPATCHER_ENABLED:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "${PORT:-3009}:3009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js"]
    networks:
      - aacp-net

  dashboard:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: aacp-dashboard
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5175:80"
    depends_on:
      - api
    networks:
      - aacp-net

  widget:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: aacp-widget
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5176:80"
    depends_on:
      - api
    networks:
      - aacp-net

networks:
  aacp-net:
    driver: bridge

volumes:
  aacp-postgres-data:
  aacp-redis-data:
