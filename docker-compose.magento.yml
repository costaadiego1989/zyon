# Magento 2 local development instance for E2E testing
# Usage: docker compose -p magento -f docker-compose.magento.yml up -d --build
# First run installs Magento automatically (~8-12min)

services:
  magento-db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: magento_root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3308:3306"
    volumes:
      - magento_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmagento_root"]
      interval: 5s
      timeout: 3s
      retries: 10

  magento-elasticsearch:
    image: elasticsearch:7.17.10
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9201:9200"
    volumes:
      - magento_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  magento:
    build:
      context: .
      dockerfile: docker/magento/Dockerfile
    environment:
      - MYSQL_HOST=magento-db
      - MYSQL_DATABASE=magento
      - MYSQL_USER=magento
      - MYSQL_PASSWORD=magento
      - MAGENTO_ADMIN_USER=admin
      - MAGENTO_ADMIN_PASSWORD=Admin123!
      - MAGENTO_ADMIN_EMAIL=admin@zyon.test
      - MAGENTO_ADMIN_FIRSTNAME=Zyon
      - MAGENTO_ADMIN_LASTNAME=Dev
      - MAGENTO_BASE_URL=http://localhost:8090/
      - ELASTICSEARCH_HOST=magento-elasticsearch
      - ELASTICSEARCH_PORT=9200
    ports:
      - "8090:80"
    volumes:
      - magento_data:/var/www/html
      - ./apps/magento-extension:/var/www/html/app/code/Zyon/Checkout:ro
    depends_on:
      magento-db:
        condition: service_healthy
      magento-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/rest/V1/store/storeConfigs || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 300s

volumes:
  magento_db_data:
  magento_es_data:
  magento_data:
