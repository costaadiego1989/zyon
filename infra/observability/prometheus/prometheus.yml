global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Local evaluation only; no notification receiver is configured.
rule_files:
  - /etc/prometheus/rules/storefront-local.yml

scrape_configs:
  - job_name: "aacp-api"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: "zyon-api"
          environment: "development"
    # Development-only target. For production use HTTPS/private networking and
    # a mounted secret file with the API's OPS_SHARED_SECRET (Basic is not accepted).
    # authorization:
    #   type: Bearer
    #   credentials_file: /run/secrets/ops_shared_secret
