services:
  # ─── Grafana (visualization) ───────────────────────────────────────
  grafana:
    image: grafana/grafana:11.6-ubuntu
    container_name: aacp-grafana
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - observability

  # ─── Prometheus (metrics) ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: aacp-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-remote-write-receiver"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - observability

  # ─── Tempo (distributed tracing) ──────────────────────────────────
  tempo:
    image: grafana/tempo:2.7.2
    container_name: aacp-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
      - "127.0.0.1:3200:3200"   # Tempo query frontend
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - observability

  # ─── Loki (log aggregation) ────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.3
    container_name: aacp-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - observability

  # Promtail is retired. Explicitly opt in to local managed API logs only.
  alloy:
    image: grafana/alloy:v1.20.1
    profiles: ["logs"]
    command: ["run", "--disable-reporting", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      - loki
    networks:
      - observability

volumes:
  grafana-data:
  prometheus-data:
  tempo-data:
  loki-data:
  alloy-data:

networks:
  observability:
    driver: bridge
