# ============================================================================
# AACP — Production compose with Caddy reverse proxy (auto SSL via Let's Encrypt).
# Usage: docker compose -f docker-compose.production.yml --env-file .env up -d
# ============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: aacp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
    networks:
      - aacp-net

  postgres:
    image: postgres:16-alpine
    container_name: aacp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aacp-postgres-data:/var/lib/postgresql/data
    networks:
      - aacp-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aacp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3009"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      E2E_SEED_ENABLED: "false"
      WEBHOOK_DISPATCHER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js"]
    networks:
      - aacp-net

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: aacp-dashboard
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5175:80"
    depends_on:
      - api
    networks:
      - aacp-net

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: aacp-widget
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5176:80"
    depends_on:
      - api
    networks:
      - aacp-net

networks:
  aacp-net:
    driver: bridge

volumes:
  aacp-postgres-data:
  caddy_data:
  caddy_config:
