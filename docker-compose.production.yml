# Production docker-compose for custom domains with Caddy reverse proxy.
# Caddy handles SSL (Let's Encrypt) automatically for merchant custom domains.
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# Ports:
#   80  → Caddy (HTTP redirect + ACME challenge)
#   443 → Caddy (HTTPS termination + reverse proxy)
#   3009 → API (internal, not exposed externally)
#   3001 → Storefront (internal, not exposed externally)

services:
  caddy:
    image: caddy:2-alpine
    container_name: aacp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - storefront
      - api
    networks:
      - aacp-net

  postgres:
    image: postgres:16-alpine
    container_name: aacp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-atendeai}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-aacp_prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-atendeai} -d ${DB_NAME:-aacp_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aacp-postgres-data:/var/lib/postgresql/data
    networks:
      - aacp-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aacp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3009"
      DATABASE_URL: postgresql://${DB_USER:-atendeai}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-aacp_prod}?schema=public
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js"]
    networks:
      - aacp-net

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: aacp-storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: http://api:3009
    networks:
      - aacp-net

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: aacp-dashboard
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: https://${PLATFORM_DOMAIN:-app.zyon.com}
    ports:
      - "5175:80"
    depends_on:
      - api
    networks:
      - aacp-net

networks:
  aacp-net:
    driver: bridge

volumes:
  aacp-postgres-data:
  caddy_data:
  caddy_config:
