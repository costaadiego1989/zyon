services:
  redis:
    image: redis:7-alpine
    container_name: aacp-redis
    env_file: []
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aacp-redis-data:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aacp-postgres
    environment:
      POSTGRES_USER: atendeai
      POSTGRES_PASSWORD: atendeai_dev
      POSTGRES_DB: aacp_dev
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atendeai -d aacp_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aacp-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  aacp-redis-data:
  aacp-postgres-data:
