# Nginx config for widget_v2 SPA (React Router compatible).
# Listens on 8080 (nginx-unprivileged default).

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers — CSP, X-Frame, Referrer-Policy, Permissions-Policy.
    add_header X-Frame-Options          "SAMEORIGIN"               always;
    add_header X-Content-Type-Options   "nosniff"                  always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    # CSP intentionally lax: widget embeds merchant-provided scripts.
    # Adjust if stricter posture is needed.
    add_header Content-Security-Policy  "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:;" always;

    # Long-cache hashed assets (Vite emits /assets/*-HASH.*).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown path returns index.html so React Router owns routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health endpoint for orchestrator probes (separate from /).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gzip + brotli compression for text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml;
}
