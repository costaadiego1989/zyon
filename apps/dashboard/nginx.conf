server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:* https://*.zyon.ai; font-src 'self' data:;" always;

  # Vite SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Health check for load balancers.
  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
