<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Regressões locais da auditoria</title></head>
<body><div id="root"></div><script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import "/src/styles.css";
import { ApiContext } from "/src/hooks/useApi.ts";
import { createDashboardApi } from "/src/api-client.ts";
import { AgentConfigPage } from "/src/pages/agent-config-page.tsx";
import { ThemePage } from "/src/pages/theme-page.tsx";

import { PaymentConnectionsPage } from "/src/pages/payment-connections/PaymentConnectionsPage.tsx";
import { CheckoutSettingsPage } from "/src/pages/checkout-settings/CheckoutSettingsPage.tsx";

const api=createDashboardApi({baseUrl:apiBaseUrl});
const me={id:"merchant-test",name:"Athom QA local",role:"OWNER",email:"qa@example.com",plan:"scale"};
