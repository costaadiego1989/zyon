
# Kong API Gateway: forwards requests to the local AACP API.
# Handles IP rate limits, CORS, request size limits, and access logs.
#
# Usage:
#   docker compose -f docker-compose.kong.yml up -d --build
#
# Endpoints:
#   Kong Proxy:  http://localhost:8000 (clients call this)
#   AACP API:    http://localhost:3009 (must already be running)
#   Admin API is disabled. Configuration: infra/kong/render-config.lua.

services:
  kong:
    build: ./infra/kong
    environment:
      UPSTREAM_API_HOST: host.docker.internal
      UPSTREAM_API_PORT: "3009"
      GATEWAY_RATE_LIMIT_POLICY: local
      GATEWAY_CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174,http://localhost:5175
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
