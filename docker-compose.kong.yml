version: "3.9"

# Kong API Gateway — sits between clients and AACP API
# Handles: auth injection, rate limiting, CORS, caching, logging
#
# Usage:
#   docker-compose -f docker-compose.kong.yml up -d
#
# Endpoints:
#   Kong Proxy:  http://localhost:8000 (clients call this)
#   Kong Admin:  http://localhost:8001 (management API)
#   AACP API:    http://localhost:3009 (internal, not exposed to internet)

services:
  kong:
    image: kong:3.7
    container_name: aacp_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_LOG_LEVEL: info
    ports:
      - "8000:8000"   # HTTP proxy (clients connect here)
      - "8443:8443"   # HTTPS proxy
      - "8001:8001"   # Admin API
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: zyon_network
    external: true
